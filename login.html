<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | FitnessFirst.lk</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-section {
      display: flex;
      min-height: calc(100vh - 80px); /* Adjust for navbar */
      background: var(--bg-dark);
    }

    .auth-image {
      flex: 1;
      background: linear-gradient(135deg, rgba(20,0,0,0.8) 0%, rgba(20,0,0,0.3) 100%), url('https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?q=80&w=2070&auto=format&fit=crop') center/cover;
      display: none;
    }

    .auth-form-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .auth-card {
      background: var(--bg-card);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 3rem;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }

    .auth-card h2 {
      font-family: var(--font-heading);
      font-size: 2rem;
      color: #fff;
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .auth-card p.subtitle {
      text-align: center;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .input-group {
      margin-bottom: 1.5rem;
      position: relative;
    }

    .input-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .input-group input {
      width: 100%;
      padding: 1rem;
      background: #111;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: #fff;
      font-family: var(--font-body);
      transition: var(--transition);
    }

    .input-group input:focus {
      outline: none;
      border-color: var(--accent-red);
      box-shadow: 0 0 10px rgba(255,51,51,0.2);
    }

    .toggle-password {
      position: absolute;
      right: 15px;
      top: 42px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
    }

    .toggle-password:hover {
      color: #fff;
    }

    .btn-full {
      width: 100%;
      padding: 1rem;
      font-size: 1.1rem;
      margin-top: 1rem;
    }

    .auth-links {
      text-align: center;
      margin-top: 1.5rem;
    }

    .auth-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.3s;
    }

    .auth-links a:hover {
      color: var(--accent-red);
    }

    .message-box {
      display: none;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      text-align: center;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .message-success {
      background: rgba(46, 204, 113, 0.2);
      color: #2ecc71;
      border: 1px solid #2ecc71;
    }

    .message-error {
      background: rgba(231, 76, 60, 0.2);
      color: #e74c3c;
      border: 1px solid #e74c3c;
    }

    .loading-spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (min-width: 768px) {
      .auth-image {
        display: block;
      }
    }
  </style>
</head>
<body>
  
  <nav class="navbar" id="navbar">
    <div class="logo">FitnessFirst<span class="dot-lk">.lk</span></div>
    
    <div class="hamburger" id="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </div>
    
    <ul class="nav-links" id="nav-links">
      <li><a href="fitness first.html">Home</a></li>
      <li><a href="services.html">Classes</a></li>
      <li><a href="trainers.html">Trainers</a></li>
      <li><a href="pricing.html">Pricing</a></li>
      <li><a href="mealplans.html">Meal Plans</a></li>
      <li><a href="register.html" class="nav-btn">Register</a></li>
    </ul>
  </nav>

  <main class="auth-section">
    <div class="auth-image"></div>
    <div class="auth-form-container">
      <div class="auth-card reveal">
        <h2>Welcome Back</h2>
        <p class="subtitle">Log in to continue your fitness journey</p>

        <div id="statusMessage" class="message-box" role="alert" aria-live="assertive"></div>

        <form id="loginForm">
          <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required />
          </div>
          
          <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required />
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">Show</button>
          </div>

          <button type="submit" class="btn btn-primary btn-full" id="submitBtn">
            <span class="btn-text">Login</span>
            <div class="loading-spinner"></div>
          </button>
        </form>

        <div class="auth-links">
          <a href="register.html">Don't have an account? Sign Up</a>
        </div>
      </div>
    </div>
  </main>

  <script src="site.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Toggle Password Visibility
      const togglePassword = document.getElementById("togglePassword");
      const passwordField = document.getElementById("password");

      togglePassword.addEventListener("click", () => {
        const type = passwordField.getAttribute("type") === "password" ? "text" : "password";
        passwordField.setAttribute("type", type);
        togglePassword.textContent = type === "password" ? "Show" : "Hide";
      });

      // Form Submission
      const loginForm = document.getElementById("loginForm");
      const submitBtn = document.getElementById("submitBtn");
      const btnText = document.querySelector(".btn-text");
      const spinner = document.querySelector(".loading-spinner");
      const statusMessage = document.getElementById("statusMessage");

      function showMessage(msg, isSuccess) {
        statusMessage.textContent = msg;
        statusMessage.className = "message-box " + (isSuccess ? "message-success" : "message-error");
        statusMessage.style.display = "block";
      }

      loginForm.addEventListener("submit", function (e) {
        e.preventDefault();
        
        // UI Loading State
        btnText.style.display = "none";
        spinner.style.display = "block";
        submitBtn.disabled = true;
        statusMessage.style.display = "none";

        const formData = new FormData(loginForm);

        fetch("login.php", {
          method: "POST",
          body: formData
        })
        .then(res => res.json())
        .then(data => {
          showMessage(data.message, data.success);
          
          if (data.success) {
            setTimeout(() => {
              window.location.href = "services.html";
            }, 1000);
          } else {
            // Restore button
            btnText.style.display = "block";
            spinner.style.display = "none";
            submitBtn.disabled = false;
          }
        })
        .catch(() => {
          showMessage("Something went wrong connecting to the server.", false);
          btnText.style.display = "block";
          spinner.style.display = "none";
          submitBtn.disabled = false;
        });
      });
    });
  </script>
</body>
</html>
